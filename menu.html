<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0c">
<title>Roof Lounge Cafe · Menü</title>
<meta name="description" content="Roof Lounge Cafe Alanya dijital menü — fiyatlar, kaloriler ve alerjen bilgileri. Türkçe, English, Русский.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/menu.css">
</head>
<body>
<header class="hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="hero-top">
    <div class="top-left">
    <a class="icon-btn" href="index.html" aria-label="Ana sayfa">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <button class="icon-btn" id="infoBtn" aria-label="Bilgi">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>
    </button>
    </div>
    <div class="langs" role="group" aria-label="Dil / Language">
      <button data-lang="tr">TR</button><button data-lang="en">EN</button><button data-lang="ru">RU</button>
    </div>
  </div>
  <div class="brand">
    <div class="brand-mark">ROOF</div>
    <div class="brand-sub"><span id="brandName">Lounge Cafe</span> · <span id="brandCity">Alanya</span></div>
    <p class="tagline" id="tagline"></p>
  </div>
</header>

<nav class="sticky" id="sticky">
  <div class="sections" id="sections" role="tablist"></div>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <button class="icon-btn small" id="searchBtn" aria-label="Ara">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn small" id="filterBtn" aria-label="Filtre">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span class="dot" id="filterDot" hidden></span>
    </button>
  </div>
  <div class="searchbar" id="searchbar" hidden>
    <input type="search" id="searchInput" autocomplete="off">
    <button class="link" id="searchClose"></button>
  </div>
</nav>

<main id="list" aria-live="polite"><div class="loading"><span></span><span></span><span></span></div></main>

<footer class="foot">
  <p id="notice"></p>
  <p class="foot-meta" id="footMeta"></p>
</footer>

<!-- Ürün detayı -->
<div class="sheet" id="productSheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <article class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="pdName">
    <button class="sheet-x" data-close aria-label="Kapat">×</button>
    <div class="pd-media" id="pdMedia"></div>
    <div class="pd-body">
      <div class="pd-tags" id="pdTags"></div>
      <h2 id="pdName"></h2>
      <p class="pd-desc" id="pdDesc"></p>
      <div class="pd-prices" id="pdPrices"></div>
      <div class="pd-facts" id="pdFacts"></div>
      <div class="pd-allergens" id="pdAllergens"></div>
    </div>
  </article>
</div>

<!-- Filtre -->
<div class="sheet" id="filterSheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel pad" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <button class="sheet-x" data-close aria-label="Kapat">×</button>
    <h2 id="fTitle"></h2>
    <h3 id="fDietTitle"></h3>
    <div class="toggle-grid" id="fDiet"></div>
    <h3 id="fAllergenTitle"></h3>
    <p class="muted small" id="fAllergenHint"></p>
    <div class="toggle-grid" id="fAllergens"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="fClear"></button>
      <button class="btn" data-close id="fApply"></button>
    </div>
  </div>
</div>

<!-- Bilgi -->
<div class="sheet" id="infoSheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel pad" role="dialog" aria-modal="true">
    <button class="sheet-x" data-close aria-label="Kapat">×</button>
    <div id="infoBody"></div>
  </div>
</div>

<script src="assets/shared.js"></script>
<script src="assets/menu.js"></script>
</body>
</html>
